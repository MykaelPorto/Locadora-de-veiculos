# Configuração do Alembic (migrações do banco de dados)
#
# Comandos principais (rodar na raiz do projeto):
#   alembic upgrade head                                   -> cria/atualiza o banco
#   alembic revision --autogenerate -m "descricao"         -> gera nova migração a partir dos modelos
#   alembic current / alembic history                      -> mostra a versão atual / o histórico
#   alembic downgrade -1                                   -> desfaz a última migração

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

# Nome dos arquivos de migração: data + id + descrição (fica em ordem cronológica)
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# A URL do banco NÃO fica aqui: ela é lida de app/core/config.py (variável DATABASE_URL / .env)
# dentro de alembic/env.py, para a API e as migrações usarem sempre o mesmo banco.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
